version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mondialito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: mondialito
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mondialito"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mondialito:${POSTGRES_PASSWORD:-changeme}@db:5432/mondialito?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Mete yon sekrè long nan .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Mete yon sekrè long nan .env}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@mondialito.example}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Mete yon modpas admin inisyal nan .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Mondialito <no-reply@mondialito.example>}
      MIN_AGE_YEARS: ${MIN_AGE_YEARS:-18}
      MIN_DEPOSIT_HTG: ${MIN_DEPOSIT_HTG:-500}
      KYC_UPLOAD_DIR: /data/kyc-uploads
      NODE_ENV: production
    volumes:
      - kyc_uploads:/data/kyc-uploads
    expose:
      - "4000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      BACKEND_INTERNAL_HOST: server:4000
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
  kyc_uploads:
